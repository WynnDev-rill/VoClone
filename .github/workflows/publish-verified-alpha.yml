name: Verify owner upgrade and publish alpha
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed source commit with the already verified application code'
        required: true
        type: string
      tested_run:
        description: 'Successful Android validation run for this application code'
        required: true
        default: '41314858599'
        type: string
      validated_run:
        description: 'Successful final APK build/UI/kernel regression run'
        required: true
        default: '41317679233'
        type: string
      publish:
        description: 'Publish after all tests including real Worker inference pass'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Select immutable source and verify APK identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          cp release-inputs/VoClone-0.2.0-alpha-arm64.apk "$RUNNER_TEMP/owner-v2.apk"
          cp release-inputs/upgrade-real-preview.wav "$RUNNER_TEMP/upgrade-preview.wav"
          cp scripts/test-owner-upgrade.sh "$RUNNER_TEMP/test-owner-upgrade.sh"
          git checkout --detach "$SOURCE_COMMIT"
          echo '4762f1ebe292567f1ca192d5c86f293c381ae1c6ffc7698b3fb83fe0085f16be  '"$RUNNER_TEMP/owner-v2.apk" | sha256sum -c -
          gh release download v0.1.0-alpha --repo WynnDev-rill/VoClone --pattern 'VoClone-0.1.0-alpha-arm64.apk' --dir "$RUNNER_TEMP"
          echo 'ab46b56234467c07c596518f5a386f52eb1dcab2a1771f0dff8ec8dd64853447  '"$RUNNER_TEMP/VoClone-0.1.0-alpha-arm64.apk" | sha256sum -c -
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          signer=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/apksigner'
          for name in ('owner-v2.apk','VoClone-0.1.0-alpha-arm64.apk'):
              output=subprocess.check_output([str(signer),'verify','--verbose','--print-certs',str(pathlib.Path(os.environ['RUNNER_TEMP'])/name)],text=True)
              print(name,output)
              assert re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)',output).group(1)==pathlib.Path('docs/signing-sha256.txt').read_text().strip()
          PY
      - run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Rehearse actual same-owner APK upgrade and preserved UI profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          VOCLONE_SOURCE_ROOT: ${{ github.workspace }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/test-owner-upgrade.sh" "$RUNNER_TEMP/VoClone-0.1.0-alpha-arm64.apk" "$RUNNER_TEMP/owner-v2.apk" "$RUNNER_TEMP/upgrade-preview.wav"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: VoClone-owner-upgrade-evidence
          path: qa/upgrade/
  publish:
    if: inputs.publish
    needs: upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Require completed build, UI, ARM math and real inference for matching application code
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_RUN: ${{ inputs.tested_run }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          run=json.loads(subprocess.check_output(['gh','run','view',os.environ['TESTED_RUN'],'--json','status,conclusion,headSha,jobs']))
          assert run['status']=='completed' and run['conclusion']=='success'
          for name in ('validate','arm-kernels','emulator','real-inference'):
              assert any(j['name']==name and j['conclusion']=='success' for j in run['jobs']),name
          final=json.loads(subprocess.check_output(['gh','run','view',os.environ['VALIDATED_RUN'],'--json','status,conclusion,headSha,jobs']))
          assert final['status']=='completed' and final['conclusion']=='success'
          for name in ('validate','arm-kernels','emulator'):
              assert any(j['name']==name and j['conclusion']=='success' for j in final['jobs']),name
          subprocess.run(['git','diff','--exit-code',final['headSha'],os.environ['SOURCE_COMMIT'],'--','app','native','scripts/build-native.sh','.github/workflows/android.yml'],check=True)
          # Real Worker pipeline code must match exactly. Only the separately regression-tested
          # process-death staging pruner changed since the expensive real-inference run.
          paths=subprocess.check_output(['git','diff','--name-only',run['headSha'],os.environ['SOURCE_COMMIT'],'--','app','native','scripts/build-native.sh','.github/workflows/android.yml'],text=True).splitlines()
          assert set(paths)<=set(('app/src/main/java/id/wynn/voclone/SpeechStorage.kt','app/src/test/java/id/wynn/voclone/SpeechStorageTest.kt')),paths
          PY
          cp release-inputs/VoClone-0.2.0-alpha-arm64.apk "$RUNNER_TEMP/owner-v2.apk"
          git checkout --detach "$SOURCE_COMMIT"
          mkdir -p app/build/outputs/apk/release
          cp "$RUNNER_TEMP/owner-v2.apk" app/build/outputs/apk/release/app-release.apk
          echo '4762f1ebe292567f1ca192d5c86f293c381ae1c6ffc7698b3fb83fe0085f16be  app/build/outputs/apk/release/app-release.apk' | sha256sum -c -
          python3 native/fetch.py
          python3 scripts/package-release.py
          python3 scripts/publish-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VoClone-owner-signed-0.2.0-alpha
          path: distribution/
