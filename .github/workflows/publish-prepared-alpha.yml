name: Publish verified owner alpha
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: delivery
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a06b3005bbc80ee86e248b9a48c5924d372d11e4
          path: source
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Verify immutable owner APK and prepare matching source
        working-directory: source
        run: |
          python3 native/fetch.py
          mkdir -p app/build/outputs/apk/release
          cp ../delivery/release-inputs/VoClone-0.1.0-alpha-arm64.apk app/build/outputs/apk/release/app-release.apk
          python3 -c "import hashlib,json,pathlib; p=pathlib.Path('app/build/outputs/apk/release/app-release.apk'); m=json.loads(pathlib.Path('qa/evidence/apk-release.json').read_text()); assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256'] and p.stat().st_size==m['bytes']"
          python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release.apk
          python3 scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VoClone-owner-signed-alpha
          path: source/distribution/*.apk
          if-no-files-found: error
      - name: Publish owner alpha with complete corresponding source
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
